name: REMURA Filone B - CFTC intelligence offline LAB

on:
  pull_request:
    paths:
      - 'cot-intelligence-core.js'
      - 'cot-intelligence-watchlist.js'
      - 'scripts/cot_intelligence_watchlist.js'
      - 'tests/cot-intelligence-watchlist.test.js'
      - 'tests/cot-intelligence-public.test.js'
      - 'tests/test_cot_public_official_audit.py'
      - 'scripts/cot_public_official_audit.py'
      - 'RESEARCH-B-COT-PUBLIC-AUDIT-V20.9.md'
      - 'RESEARCH-B-COT-WATCHLIST-V20.8.md'
      - 'scripts/cot_intelligence_snapshot.py'
      - 'tests/cot-intelligence.test.js'
      - 'tests/test_cot_intelligence_snapshot.py'
      - 'RESEARCH-B-COT-INTELLIGENCE-V20.7.md'
      - '.github/workflows/cot-intelligence-lab-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cot-offline:
    name: Validate CFTC transforms without market access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check pure COT engine syntax and test fixtures
        run: |
          node --check cot-intelligence-core.js
          node --check cot-intelligence-watchlist.js
          node --check scripts/cot_intelligence_watchlist.js
          node --check tests/cot-intelligence-public.test.js
          node --test tests/cot-intelligence.test.js tests/cot-intelligence-watchlist.test.js tests/cot-intelligence-public.test.js
      - name: Check read-only SQLite snapshot fixtures
        run: python3 -m unittest discover -s tests -p 'test_cot_intelligence_snapshot.py' -v
      - name: Check two-request CFTC public read contract with mocks (no HTTP)
        run: python3 -m unittest discover -s tests -p 'test_cot_public_official_audit.py' -v

  official-public-proof:
    name: One-off CFTC official read (2 HTTPS GETs max, no secrets)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 108
    needs: cot-offline
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read official CFTC Futures Only datasets (2 public GETs, no retries)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          python3 scripts/cot_public_official_audit.py > "$WORKDIR/cot-public.json"
          node scripts/cot_intelligence_watchlist.js --input "$WORKDIR/cot-public.json" --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$WORKDIR/watchlist.json"
          python3 - "$WORKDIR/cot-public.json" "$WORKDIR/watchlist.json" <<'PY'
          import json,sys
          snap=json.load(open(sys.argv[1],encoding='utf-8'))
          w=json.load(open(sys.argv[2],encoding='utf-8'))
          print('REMURA_B_PUBLIC_CFTC_PROOF')
          print('source:',snap['source'],'readAtUtc:',snap['readAtUtc'],
                'rowCount:',snap['rowCount'],'rowsSha256:',snap['dataSha256'])
          print('watchlist_mode:',w['mode'],'watchlist_state:',w['state'])
          for dataset,item in w['periods'].items():
              print('dataset',dataset,'state',item['state'],'latest',item['latest'],
                    'previous',item['previous'],'latestPresent',item['latestPresent'],
                    'expected',item['expected'])
          for group in w['groups']:
              print('group',group['id'],'state',group['state'],'count',len(group['entries']))
              for row in group['entries'][:5]:
                  print('  ',row['symbol'],'week',row['reportDate'],
                        'deltaCategoryA_pp',round(row['deltaA_Pp'],4),
                        'categoryGap_pp',round(row['categoryGapPp'],4),
                        'type',row['referenceType'])
          if w['state'] != 'descriptive_ready':
              print('RESEARCH_NOT_READY_NO_FABRICATION')
          PY
