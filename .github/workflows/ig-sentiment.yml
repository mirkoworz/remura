name: REMURA IG client sentiment
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remura-ig-sentiment
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch licensed IG sentiment percentages
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_IDENTIFIER: ${{ secrets.IG_IDENTIFIER }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ENV: ${{ vars.IG_ENV || 'demo' }}
          IG_PUBLISH_AGGREGATES: ${{ vars.IG_PUBLISH_AGGREGATES || 'false' }}
        run: python scripts/update_ig.py
      - name: Store aggregated sentiment (if authorized)
        run: |
          if [ -d data/ig ]; then git add -A data/ig/; fi
          if ! git diff --cached --quiet; then
            git config user.name "remura-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update IG client sentiment samples"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
