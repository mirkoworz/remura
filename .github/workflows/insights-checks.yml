name: REMURA insights checks
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"
  pull_request:
    paths:
      - 'insights-core.js'
      - 'cot-indices-core.js'
      - 'mercati.html'
      - 'statistica-squali.html'
      - 'statistica-squali-core.js'
      - 'statistica-squali.js'
      - 'squalincome-diagnostics.js'
      - 'sw.js'
      - 'insights.js'
      - 'insights.css'
      - 'asset.html'
      - 'retail.js'
      - 'forex.html'
      - 'nav.js'
      - 'impostazioni.js'
      - 'impostazioni.html'
      - 'feed-health-core.js'
      - 'tests/**'
      - '.github/workflows/insights-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser script syntax
        run: |
          node --check insights-core.js
          node --check cot-indices-core.js
          node --check insights.js
          node --check retail.js
          node --check nav.js
          node --check squalincome-diagnostics.js
          node --check statistica-squali-core.js
          node --check statistica-squali.js
          node --check impostazioni.js
          node --check feed-health-core.js
      - name: Verify COT analysis rules
        run: node --test tests/insights.test.js tests/retail-chart.test.js tests/cot-indices.test.js tests/cot-scanner.test.js tests/squalincome-shortlist.test.js tests/feed-health.test.js tests/release-consistency.test.js tests/squalincome-diagnostics.test.js tests/statistica-squali.test.js
      - name: Verify wiring on all market detail pages
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('asset.html','utf8');
          for(const s of ['insights-core.js','insights.js','insights.css','REMURA_INSIGHTS?.updateCOT','REMURA_INSIGHTS?.error']) {
            if(!html.includes(s))throw new Error('Missing asset integration: '+s);
          }
          const retail=fs.readFileSync('retail.js','utf8');
          if(!retail.includes('remura:retail'))throw new Error('Missing retail integration');
          const nav=fs.readFileSync('nav.js','utf8');
          const fx=nav.match(/const FX_PAIRS=\[([^\]]+)\]/);
          const other=nav.match(/const OTHER=\{([\s\S]*?)\n  \};/);
          if(!fx||!other)throw new Error('Cannot verify market definitions');
          const fxCount=(fx[1].match(/"[A-Z]{6}"/g)||[]).length;
          const others=(other[1].match(/^\s*[A-Z0-9]+:\{/gm)||[]).length;
          if(fxCount!==28||others!==10)throw new Error('Expected 28 FX pairs and 10 other markets; got '+fxCount+'+'+others);
          console.log('Verified shared asset page: '+(fxCount+others)+' markets');
          NODE
