name: REMURA Myfxbook sentiment
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remura-myfxbook
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Myfxbook community aggregates
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python scripts/update_myfxbook.py
      - name: Store publicly visible aggregates
        run: |
          git add -A data/myfxbook/
          if ! git diff --cached --quiet; then
            git config user.name "remura-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update Myfxbook community sentiment samples"
            git push
          fi
