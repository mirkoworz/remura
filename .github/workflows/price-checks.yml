name: REMURA private price engine checks
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"
  pull_request:
    paths:
      - 'price-core.js'
      - 'cvd-divergence-core.js'
      - 'tests/cvd-divergence.test.js'
      - 'scripts/cvd_divergence.py'
      - 'tests/test_cvd_divergence_parity.py'
      - 'scripts/cvd_benchmark.py'
      - 'tests/test_cvd_benchmark.py'
      - 'scripts/cvd_session_replay.py'
      - 'tests/test_cvd_session_replay.py'
      - 'price.js'
      - 'price.css'
      - 'insights.js'
      - 'asset.html'
      - 'scripts/price_feed.py'
      - 'scripts/ctrader_feed.py'
      - 'scripts/price_store.py'
      - 'scripts/cot_monitor.py'
      - 'scripts/signals_monitor.py'
      - 'scripts/statistical_validation.py'
      - 'scripts/dual24_validation.py'
      - 'scripts/market_validation.py'
      - 'scripts/case_audit.py'
      - 'scripts/weekly_quality.py'
      - 'scripts/cot_week_watch.py'
      - 'tests/test_cot_week_watch.py'
      - 'tests/test_weekly_quality.py'
      - 'tests/test_case_audit.py'
      - 'tests/test_market_validation.py'
      - 'tests/test_dual24_validation.py'
      - 'scripts/session_gaps.py'
      - 'tests/test_session_gaps.py'
      - 'tests/test_statistical_validation.py'
      - 'squalincome-diagnostics.js'
      - 'statistica-squali.html'
      - 'statistica-squali-core.js'
      - 'dual24-core.js'
      - 'dual24-ui.js'
      - 'market-audit-core.js'
      - 'market-audit-ui.js'
      - 'case-audit-core.js'
      - 'case-audit-ui.js'
      - 'weekly-quality-core.js'
      - 'weekly-quality-ui.js'
      - 'cot-week-watch-core.js'
      - 'cot-week-watch-ui.js'
      - 'tests/cot-week-watch-ui.test.js'
      - 'tests/weekly-quality-ui.test.js'
      - 'tests/case-audit-ui.test.js'
      - 'tests/market-audit-ui.test.js'
      - 'tests/dual24-ui.test.js'
      - 'statistica-squali.js'
      - 'tests/statistica-squali.test.js'
      - 'tests/test_cot_monitor.py'
      - 'tests/test_signals_monitor.py'
      - 'scripts/private_server.py'
      - 'scripts/resource_monitor.py'
      - 'resource-health.js'
      - 'resource-health.css'
      - 'tests/test_resource_monitor.py'
      - 'scripts/update_ig.py'
      - 'scripts/update_capital.py'
      - 'tests/test_capital_sentiment.py'
      - 'tests/test_capital_private.py'
      - 'CAPITAL-DEMO.md'
      - '.github/workflows/capital-private-collector.yml'
      - 'sources.js'
      - 'sentiment-core.js'
      - 'capital-cloud.js'
      - 'capital-cloud-config.js'
      - 'tests/capital-cloud.test.js'
      - 'CAPITAL-FIRESTORE-PRIVATO.md'
      - 'tests/sentiment.test.js'
      - 'fonti.html'
      - 'sw.js'
      - 'sources.css'
      - 'tests/test_ig_sentiment.py'
      - 'tests/test_ig_private.py'
      - 'scripts/ctrader_tokens.py'
      - 'scripts/configure_ctrader_backup.py'
      - 'tests/test_ctrader_tokens.py'
      - 'tests/test_private_server.py'
      - 'scripts/squalincome_timing.py'
      - 'tests/test_squalincome_timing.py'
      - 'deploy/oracle/release_v159.py'
      - 'tests/test_release_v159.py'
      - 'deploy/oracle/reconcile_v159.py'
      - 'tests/test_reconcile_v159.py'
      - 'deploy/oracle/reconcile_v156.py'
      - 'tests/test_reconcile_v156.py'
      - 'deploy/oracle/release_v157.py'
      - 'tests/test_release_v157.py'
      - 'deploy/oracle/priority_v157.py'
      - 'tests/test_priority_v157.py'
      - 'deploy/oracle/reconcile_v157.py'
      - 'tests/test_reconcile_v157.py'
      - 'stato-prezzi.html'
      - 'stato-prezzi.js'
      - 'price-status-core.js'
      - 'tests/price-status.test.js'
      - 'PRIVATE-AUTOMATION.md'
      - 'retail.js'
      - 'sw.js'
      - 'tests/price.test.js'
      - 'tests/test_price_feed.py'
      - 'tests/market-expansion.test.js'
      - 'tests/test_ctrader_feed.py'
      - 'PRICE-ENGINE.md'
      - 'deploy/oracle/**'
      - 'ORACLE-ALWAYS-FREE.md'
      - '.github/workflows/price-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check offline CVD divergence detector
        run: node --check cvd-divergence-core.js
      - run: node --check resource-health.js && node --check price-core.js && node --check price.js && node --check price-status-core.js && node --check stato-prezzi.js && node --check insights.js && node --check sources.js && node --check sentiment-core.js && node --check capital-cloud.js && node --check capital-cloud-config.js && node --check squalincome-diagnostics.js && node --check statistica-squali-core.js && node --check statistica-squali.js && node --check dual24-core.js && node --check dual24-ui.js && node --check market-audit-core.js && node --check market-audit-ui.js && node --check case-audit-core.js && node --check case-audit-ui.js && node --check weekly-quality-core.js && node --check weekly-quality-ui.js && node --check cot-week-watch-core.js && node --check cot-week-watch-ui.js
      - name: Verify Oracle Always Free bootstrap syntax
        run: bash -n deploy/oracle/install.sh && bash -n deploy/oracle/enable-autoupdate.sh
      - name: Test offline update safety
        run: python -m unittest discover -s tests -p 'test_autoupdate.py' -v
      - name: Test v1.52 manual release rollback
        run: python -m unittest discover -s tests -p 'test_release_v152.py' -v
      - name: Test v1.56 SQLite live-snapshot and isolated restore, offline
        run: python -m unittest discover -s tests -p 'test_backup_v156.py' -v
      - name: Test v1.56 guarded manual code release and persistent rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v156.py' -v
      - name: Test v1.56 SHA reconciliation and no-deploy state update, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v156.py' -v
      - name: Test v1.57 guarded release installer, offline
        run: python -m unittest discover -s tests -p 'test_release_v157.py' -v
      - name: Test v1.58 guarded manual release and rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v158.py' -v
      - name: Test v1.58 SHA reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v158.py' -v
      - name: Test v1.57 opt-in priority backup and rollback, offline
        run: python -m unittest discover -s tests -p 'test_priority_v157.py' -v
      - name: Test v1.57 SHA-only code/backup reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v157.py' -v
      - run: python -m py_compile scripts/price_feed.py scripts/ctrader_feed.py scripts/ctrader_tokens.py scripts/configure_ctrader_backup.py scripts/price_store.py scripts/cot_monitor.py scripts/signals_monitor.py scripts/statistical_validation.py scripts/dual24_validation.py scripts/market_validation.py scripts/case_audit.py scripts/weekly_quality.py scripts/cot_week_watch.py scripts/session_gaps.py scripts/private_server.py scripts/resource_monitor.py scripts/update_capital.py
      - name: Test offline price/CVD proxy pivot divergence
        run: node --test tests/cvd-divergence.test.js
      - name: Test JS/Python causal CVD proxy parity without broker access
        run: python -m unittest discover -s tests -p 'test_cvd_divergence_parity.py' -v
      - name: Test offline matched price/CVD benchmark, horizon, and volume controls
        run: python -m unittest discover -s tests -p 'test_cvd_benchmark.py' -v
      - name: Test archived M15 multi-session replay boundaries, offline
        run: python -m unittest discover -s tests -p 'test_cvd_session_replay.py' -v
      - run: node --test tests/price.test.js tests/insights.test.js tests/sentiment.test.js tests/capital-cloud.test.js tests/market-expansion.test.js tests/price-status.test.js tests/squalincome-diagnostics.test.js tests/statistica-squali.test.js tests/dual24-ui.test.js tests/market-audit-ui.test.js tests/case-audit-ui.test.js tests/weekly-quality-ui.test.js tests/cot-week-watch-ui.test.js
      - run: python -m unittest discover -s tests -p 'test_price_feed.py' -v
      - run: python -m unittest discover -s tests -p 'test_ctrader_feed.py' -v
      - run: python -m unittest discover -s tests -p 'test_private_server.py' -v
      - name: Test offline Squalincome scan latency and retention (v1.59 candidate)
        run: python -m unittest discover -s tests -p 'test_squalincome_timing.py' -v
      - name: Test v1.59 guarded release and new-module rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v159.py' -v
      - name: Test v1.59 SHA-only reconciliation and rollback manifest, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v159.py' -v
      - run: python -m unittest discover -s tests -p 'test_resource_monitor.py' -v
      - run: python -m unittest discover -s tests -p 'test_cot_monitor.py' -v
      - run: python -m unittest discover -s tests -p 'test_signals_monitor.py' -v
      - run: python -m unittest discover -s tests -p 'test_statistical_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_dual24_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_market_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_case_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_weekly_quality.py' -v
      - run: python -m unittest discover -s tests -p 'test_cot_week_watch.py' -v
      - run: python -m unittest discover -s tests -p 'test_session_gaps.py' -v
      - run: python -m unittest discover -s tests -p 'test_ig_sentiment.py' -v
      - run: python -m unittest discover -s tests -p 'test_ig_private.py' -v
      - run: python -m unittest discover -s tests -p 'test_capital_sentiment.py' -v
      - run: python -m unittest discover -s tests -p 'test_capital_private.py' -v
      - run: python -m unittest discover -s tests -p 'test_ctrader_tokens.py' -v
      - name: Verify no personal feed or API token is publicly embedded
        run: |
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('asset.html','utf8'),ui=fs.readFileSync('price.js','utf8');
          for (const script of ['price-core.js?v=11','price.js?v=11','price.css?v=11'])
            if(!html.includes(script))throw new Error('Missing asset integration: '+script);
          if(!ui.includes('type="file"'))throw new Error('Local file chooser missing');
          if(ui.includes('api.twelvedata.com')||ui.includes('api-fxpractice.oanda.com'))
            throw new Error('Frontend must never call credentialled price APIs');
          if(!fs.readFileSync('.gitignore','utf8').includes('local/'))
            throw new Error('Private prices not gitignored');
          console.log('Private file-only UI verified');
          NODE
