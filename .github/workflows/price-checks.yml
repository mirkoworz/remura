      - 'retail.js'
      - 'sw.js'
      - 'tests/price.test.js'
      - 'tests/test_price_feed.py'
      - 'tests/market-expansion.test.js'
      - 'tests/test_ctrader_feed.py'
      - 'PRICE-ENGINE.md'
      - 'deploy/oracle/**'
      - 'ORACLE-ALWAYS-FREE.md'
      - '.github/workflows/price-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check resource-health.js && node --check price-core.js && node --check price.js && node --check price-status-core.js && node --check stato-prezzi.js && node --check insights.js && node --check sources.js && node --check sentiment-core.js && node --check capital-cloud.js && node --check capital-cloud-config.js && node --check squalincome-diagnostics.js && node --check squalincome-freshness-core.js && node --check statistica-squali-core.js && node --check statistica-squali.js && node --check dual24-core.js && node --check dual24-ui.js && node --check market-audit-core.js && node --check market-audit-ui.js && node --check case-audit-core.js && node --check case-audit-ui.js && node --check weekly-quality-core.js && node --check weekly-quality-ui.js && node --check cot-week-watch-core.js && node --check cot-week-watch-ui.js
      - name: Verify Oracle Always Free bootstrap syntax
        run: bash -n deploy/oracle/install.sh && bash -n deploy/oracle/enable-autoupdate.sh
      - name: Test offline update safety
        run: python -m unittest discover -s tests -p 'test_autoupdate.py' -v
      - name: Test v1.52 manual release rollback
        run: python -m unittest discover -s tests -p 'test_release_v152.py' -v
      - name: Test v1.56 SQLite live-snapshot and isolated restore, offline
        run: python -m unittest discover -s tests -p 'test_backup_v156.py' -v
      - name: Test v1.56 guarded manual code release and persistent rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v156.py' -v
      - name: Test v1.56 SHA reconciliation and no-deploy state update, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v156.py' -v
      - name: Test v1.57 guarded release installer, offline
        run: python -m unittest discover -s tests -p 'test_release_v157.py' -v
      - name: Test v1.58 guarded manual release and rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v158.py' -v
      - name: Test v1.58 SHA reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v158.py' -v
      - name: Test v1.57 opt-in priority backup and rollback, offline
        run: python -m unittest discover -s tests -p 'test_priority_v157.py' -v
      - name: Test v1.57 SHA-only code/backup reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v157.py' -v
      - run: python -m py_compile scripts/price_feed.py scripts/ctrader_feed.py scripts/ctrader_tokens.py scripts/configure_ctrader_backup.py scripts/price_store.py scripts/cot_monitor.py scripts/signals_monitor.py scripts/h1_batch_comparison.py scripts/h1_paired_store.py scripts/statistical_validation.py scripts/dual24_validation.py scripts/market_validation.py scripts/case_audit.py scripts/weekly_quality.py scripts/cot_week_watch.py scripts/session_gaps.py scripts/private_server.py scripts/batch_timing.py scripts/resource_monitor.py scripts/update_capital.py
      - run: node --test tests/price.test.js tests/insights.test.js tests/sentiment.test.js tests/capital-cloud.test.js tests/market-expansion.test.js tests/price-status.test.js tests/squalincome-diagnostics.test.js tests/squalincome-freshness.test.js tests/statistica-squali.test.js tests/dual24-ui.test.js tests/market-audit-ui.test.js tests/case-audit-ui.test.js tests/weekly-quality-ui.test.js tests/cot-week-watch-ui.test.js
      - run: python -m unittest discover -s tests -p 'test_price_feed.py' -v
      - run: python -m unittest discover -s tests -p 'test_ctrader_feed.py' -v
      - name: Draft v1.65 opt-in storage metadata, backup local, stale cache and HTTP compatibility (offline)
        run: python -m unittest discover -s tests -p 'test_storage_v165_draft.py' -v
      - name: Draft v1.65 14-file SHA pins and nine-page timestamp preview (offline, NO RELEASE)
        run: python -m unittest discover -s tests -p 'test_v165_release_offline_preview.py' -v
      - name: Draft v1.65 synthetic WAL backup, restore and rollback (offline, NO LIVE)
        run: python -m unittest discover -s tests -p 'test_v165_release_transaction_lab.py' -v
      - name: Draft v1.65 manifest and release-order proof (offline NO-GO)
        run: python -m unittest discover -s tests -p 'test_v165_release_protocol_draft.py' -v
      - name: Draft v1.65 SHA/tree and strict CI push-main fixture (offline NO-GO)
        run: python -m unittest discover -s tests -p 'test_v165_pinned_preflight_lab.py' -v
      - name: Draft v1.65 persisted fake rollback bundle and injected failures (NO LIVE)
        run: python -m unittest discover -s tests -p 'test_v165_rollback_bundle_lab.py' -v
      - name: Draft v1.65 fake LIVE baseline, autoupdater state and inverse rollback gates (NO LIVE)
        run: python -m unittest discover -s tests -p 'test_v165_autoupdater_state_lab.py' -v
      - name: Draft v1.65 incident triage decision tree, offline-only NO-GO
        run: python -m unittest discover -s tests -p 'test_v165_incident_decision_lab.py' -v
      - name: Draft v1.65 private evidence plan with 12 strict synthetic slots (NO LIVE)
        run: python -m unittest discover -s tests -p 'test_v165_preflight_evidence_lab.py' -v
      - name: Draft v1.65 bounded read-only preflight arithmetic on fake snapshots (NO LIVE)
        run: python -m unittest discover -s tests -p 'test_v165_readonly_preflight_fixture.py' -v
      - run: python -m unittest discover -s tests -p 'test_private_server.py' -v
      - name: Test offline opt-in batch timing, no new broker requests (v1.61 research)
        run: python -m unittest discover -s tests -p 'test_batch_timing.py' -v
      - name: Test offline Squalincome scan latency and retention (v1.59 candidate)
        run: python -m unittest discover -s tests -p 'test_squalincome_timing.py' -v
      - name: Test v1.59 guarded release and new-module rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v159.py' -v
      - name: Test guarded v1.60 code release, offline (backup, rollback and immutable version)
        run: python -m unittest discover -s tests -p 'test_release_v160.py' -v
      - name: Test v1.61 pinned guarded telemetry code release, offline
        run: python -m unittest discover -s tests -p 'test_release_v161.py' -v
      - name: Test v1.61 independent pinned SHA-only reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v161.py' -v
      - name: Test v1.60 pinned SHA-only autoupdater reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v160.py' -v
      - name: Test v1.59 SHA-only reconciliation and rollback manifest, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v159.py' -v
      - run: python -m unittest discover -s tests -p 'test_resource_monitor.py' -v
      - run: python -m unittest discover -s tests -p 'test_cot_monitor.py' -v
      - name: Test v1.62 research-only paired H1 common UTC snapshot, offline
        run: python -m unittest discover -s tests -p 'test_h1_batch_comparison.py' -v
      - name: Test v1.62 private opt-in H1 pairing and bounded aggregate store, offline
        run: python -m unittest discover -s tests -p 'test_h1_paired_store.py' -v
      - name: "Test v1.62 guarded release: pinned base, SQLite, rollback and nine-page banner"
        run: python -m unittest discover -s tests -p 'test_release_v162.py' -v
      - name: Test v1.62 pinned SHA-only reconciliation and rollback proof
        run: python -m unittest discover -s tests -p 'test_reconcile_v162.py' -v
      - name: Test v1.63 splash release safety and VPS rollback, offline
        run: python -m unittest discover -s tests -p 'test_release_v163.py' -v
      - name: Test v1.63 immutable reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v163.py' -v
      - name: Test v1.64 cinematic guarded release and DB restore gate, offline
        run: python -m unittest discover -s tests -p 'test_release_v164.py' -v
      - name: Test v1.64 exact 15-file SHA state reconciliation, offline
        run: python -m unittest discover -s tests -p 'test_reconcile_v164.py' -v
      - run: python -m unittest discover -s tests -p 'test_signals_monitor.py' -v
      - run: python -m unittest discover -s tests -p 'test_statistical_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_dual24_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_market_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_case_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_weekly_quality.py' -v
      - run: python -m unittest discover -s tests -p 'test_cot_week_watch.py' -v
      - run: python -m unittest discover -s tests -p 'test_session_gaps.py' -v
      - run: python -m unittest discover -s tests -p 'test_ig_sentiment.py' -v
      - run: python -m unittest discover -s tests -p 'test_ig_private.py' -v
      - run: python -m unittest discover -s tests -p 'test_capital_sentiment.py' -v
      - run: python -m unittest discover -s tests -p 'test_capital_private.py' -v
      - run: python -m unittest discover -s tests -p 'test_ctrader_tokens.py' -v
      - name: Verify no personal feed or API token is publicly embedded
        run: |
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('asset.html','utf8'),ui=fs.readFileSync('price.js','utf8');
          for (const script of ['price-core.js?v=11','price.js?v=11','price.css?v=11'])
            if(!html.includes(script))throw new Error('Missing asset integration: '+script);
          if(!ui.includes('type="file"'))throw new Error('Local file chooser missing');
          if(ui.includes('api.twelvedata.com')||ui.includes('api-fxpractice.oanda.com'))
            throw new Error('Frontend must never call credentialled price APIs');
          if(!fs.readFileSync('.gitignore','utf8').includes('local/'))
            throw new Error('Private prices not gitignored');
          console.log('Private file-only UI verified');
          NODE
