# REMURA Contributors v0.81 LAB — ONE SHOT, 21 Nov 2026 CET
# Isolated static validation; no Cloudflare, provider access, secrets or deployments.
name: REMURA Contributors v0.81 route manifest ONE-SHOT
on:
  push:
    branches:
      - research/contributors-route-manifest-v081-20261121
    paths:
      - research/contributors/route_manifest_v081_lab.py
      - research/contributors/test_route_manifest_v081_lab.py
      - .github/workflows/remura-contributors-v081-one-shot-ci.yml
permissions:
  contents: read
jobs:
  route-manifest-lab:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout current commit, credentials disabled
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile ONLY new v0.81 files
        run: |
          python3 -m py_compile research/contributors/route_manifest_v081_lab.py research/contributors/test_route_manifest_v081_lab.py
      - name: Inspect locked manifest offline without provider access
        run: |
          set -euo pipefail
          python3 research/contributors/route_manifest_v081_lab.py --check | tee /tmp/remura-v081-manifest.json
          grep -q '"automatic_deploy_allowed": false' /tmp/remura-v081-manifest.json
          grep -q '"decision": "NO_GO"' /tmp/remura-v081-manifest.json
      - name: Run ONLY 20 NEW v0.81 checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/contributors -p 'test_route_manifest_v081_lab.py' -q 2>&1 | tee /tmp/remura-v081-tests.log
          grep -q 'Ran 20 tests in ' /tmp/remura-v081-tests.log
          grep -q '^OK$' /tmp/remura-v081-tests.log
          echo 'REMURA_V081_ROUTE_MANIFEST=20_20_PASS'
