# REMURA Contributors v0.83 LAB | 21/11/2026 Europe/Rome | offline one-shot
name: REMURA Contributors v0.83 provenance offline ONE-SHOT
on:
  push:
    branches: [research/contributors-log-provenance-v083-20261121]
    paths:
      - research/contributors/monitor_provenance_v083_lab.py
      - research/contributors/test_monitor_provenance_v083_lab.py
      - .github/workflows/remura-contributors-v083-one-shot-ci.yml
permissions:
  contents: read
jobs:
  new-v083-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile new modules
        run: python3 -m py_compile research/contributors/monitor_provenance_v083_lab.py research/contributors/test_monitor_provenance_v083_lab.py
      - name: Self-check refuses billing proof
        run: |
          set -euo pipefail
          python3 research/contributors/monitor_provenance_v083_lab.py --synthetic-self-check | tee /tmp/v083.json
          grep -q '"decision":"NO_GO"' /tmp/v083.json
          grep -q '"d1_daily":"UNKNOWN_NOT_ZERO"' /tmp/v083.json
      - name: ONLY 20 new provenance checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/contributors -p 'test_monitor_provenance_v083_lab.py' -q 2>&1 | tee /tmp/v083.log
          grep -q 'Ran 20 tests in ' /tmp/v083.log
          grep -q '^OK$' /tmp/v083.log
          echo 'REMURA_V083_PROVENANCE=20_20_PASS'
