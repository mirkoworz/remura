# REMURA Contributors v0.86 LAB — 21/11/2026 Europe/Rome
name: REMURA Contributors v0.86 pinned read-only plan ONE-SHOT
on:
  push:
    branches: [research/contributors-readonly-probe-v086-20261121]
    paths:
      - research/contributors/readonly_probe_plan_v086_lab.py
      - research/contributors/test_readonly_probe_plan_v086_lab.py
      - .github/workflows/remura-contributors-v086-one-shot-ci.yml
permissions:
  contents: read
jobs:
  new-v086-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile only new scripts
        run: python3 -m py_compile research/contributors/readonly_probe_plan_v086_lab.py research/contributors/test_readonly_probe_plan_v086_lab.py
      - name: Offline review no execution or secrets
        run: |
          set -euo pipefail
          python3 research/contributors/readonly_probe_plan_v086_lab.py --review-synthetic-plan | tee /tmp/v086.json
          grep -q '"http_calls_performed":0' /tmp/v086.json
          grep -q '"approved_to_execute":false' /tmp/v086.json
          grep -q '"decision":"NO_GO"' /tmp/v086.json
      - name: Run ONLY 18 new planning checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/contributors -p 'test_readonly_probe_plan_v086_lab.py' -q 2>&1 | tee /tmp/v086-tests.log
          grep -q 'Ran 18 tests in ' /tmp/v086-tests.log
          grep -q '^OK$' /tmp/v086-tests.log
          echo 'REMURA_V086_READONLY_PLAN=18_18_PASS'
