# REMURA Contributors v0.89 LAB — 21/11/2026 19:03 CET
name: REMURA Contributors v0.89 interactive offline pilot ONE-SHOT
on:
  push:
    branches: [research/contributors-interactive-pilot-v089-20261121]
    paths:
      - research/contributors/contributors_pilot_interactive_v089_lab.html
      - research/contributors/test_pilot_interactive_v089_lab.mjs
      - .github/workflows/remura-contributors-v089-one-shot-ci.yml
permissions:
  contents: read
jobs:
  interactive-new-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run ONLY 30 new simulator checks
        run: |
          set -euo pipefail
          node --test research/contributors/test_pilot_interactive_v089_lab.mjs 2>&1 | tee /tmp/v089-new.log
          grep -q 'tests 30' /tmp/v089-new.log
          grep -q 'pass 30' /tmp/v089-new.log
          grep -q 'fail 0' /tmp/v089-new.log
          echo 'REMURA_V089_PILOT_SIMULATOR=30_30_PASS'
