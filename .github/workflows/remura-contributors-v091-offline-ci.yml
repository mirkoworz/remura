# REMURA Contributors v0.91 LAB — 21/11/2026 Europe/Rome
# NO LIVE REQUESTS: tests use an injected transport. Zero Secrets.
name: REMURA Contributors v0.91 D1 diagnostic OFFLINE CI
on:
  push:
    branches: [research/contributors-d1-diagnostic-v091-20261121]
    paths:
      - research/contributors/cloudflare_d1_diagnostic_v091_lab.py
      - research/contributors/test_cloudflare_d1_diagnostic_v091_lab.py
      - .github/workflows/remura-contributors-v091-offline-ci.yml
permissions:
  contents: read
jobs:
  v091-new-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile only v0.91 files
        run: python3 -m py_compile research/contributors/cloudflare_d1_diagnostic_v091_lab.py research/contributors/test_cloudflare_d1_diagnostic_v091_lab.py
      - name: Offline plan, must make zero provider calls
        run: |
          set -euo pipefail
          python3 research/contributors/cloudflare_d1_diagnostic_v091_lab.py --offline-plan | tee /tmp/v091-plan.json
          grep -q '"provider_post_count":0' /tmp/v091-plan.json
          grep -q '"status":"OFFLINE_NOT_AUTHORIZED"' /tmp/v091-plan.json
          grep -q '"decision":"NO_GO"' /tmp/v091-plan.json
      - name: Run ONLY 25 new injected-transport tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/contributors -p 'test_cloudflare_d1_diagnostic_v091_lab.py' -q 2>&1 | tee /tmp/v091-tests.log
          grep -q 'Ran 25 tests in ' /tmp/v091-tests.log
          grep -q '^OK$' /tmp/v091-tests.log
          echo 'REMURA_CONTRIBUTORS_V091_D1_DIAGNOSTIC=25_25_PASS'
