# REMURA Contributors v0.92 LAB — 21/11/2026 Europe/Rome.
# Runs only NEW full-schema SQLite ownership checks; no Cloudflare calls.
name: REMURA Contributors v092 full SQLite ownership ONE-SHOT
on:
  push:
    branches:
      - research/contributors-real-sqlite-ownership-v092-20261121
    paths:
      - research/contributors/test_actual_sqlite_ownership_v092_lab.mjs
      - .github/workflows/remura-contributors-v092-sqlite-ownership-only.yml
permissions:
  contents: read
jobs:
  sqlite-ownership-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node 22 for built-in in-memory SQLite
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 14 new SQL isolation tests only
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap research/contributors/test_actual_sqlite_ownership_v092_lab.mjs 2>&1 | tee /tmp/remura-v092-sqlite.log
          grep -q '^1..14$' /tmp/remura-v092-sqlite.log
          grep -q '^# pass 14$' /tmp/remura-v092-sqlite.log
          grep -q '^# fail 0$' /tmp/remura-v092-sqlite.log
          echo 'REMURA_CONTRIBUTORS_V092_SQLITE_OWNERSHIP=14_14_PASS'
