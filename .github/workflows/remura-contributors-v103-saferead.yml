# REMURA Contributors v1.03 — only new fail-closed read-only UX checks.
name: REMURA Contributors v103 read-only presentation
on:
  push:
    branches: [research/contributors-safari-readonly-pilot-v099-20261123]
    paths:
      - research/contributors/private_worker_staging_saferead_v103_lab.mjs
      - research/contributors/staging_readonly_entry_v102_lab.mjs
      - research/contributors/test_staging_saferead_v103_lab.mjs
      - .github/workflows/remura-contributors-v103-saferead.yml
permissions:
  contents: read
jobs:
  no-post-ui:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New read-only staging presentation checks
        run: |
          set -euo pipefail
          node --check research/contributors/private_worker_staging_saferead_v103_lab.mjs
          node --check research/contributors/staging_readonly_entry_v102_lab.mjs
          node --test research/contributors/test_staging_saferead_v103_lab.mjs research/contributors/test_staging_entry_v102_lab.mjs 2>&1 | tee /tmp/remura-c-v103.log
          grep -q '# tests 9' /tmp/remura-c-v103.log
          grep -q '# pass 9' /tmp/remura-c-v103.log
          grep -q '# fail 0' /tmp/remura-c-v103.log
          echo REMURA_C_V103_READONLY_UI=PASS
