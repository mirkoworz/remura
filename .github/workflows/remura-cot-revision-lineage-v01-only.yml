# REMURA COT v0.2 LAB - NEW tests only, 22 Nov 2026 Europe/Rome.
# v0.1 lineage's 20 tests already passed on run 44959558919: do not repeat.
# Current job uses only fixtures, SQLite :memory:, stdlib; no network/secrets.
name: REMURA COT v02 atomic capture NEW tests only
on:
  push:
    branches:
      - research/cot-revision-lineage-lab-20261121
    paths:
      - research/cot/cot_atomic_ingest_v02_lab.py
      - research/cot/test_cot_atomic_ingest_v02_lab.py
      - .github/workflows/remura-cot-revision-lineage-v01-only.yml
permissions:
  contents: read
jobs:
  atomic-cot-new-tests-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile v02 module and only new fixture tests
        run: python3 -m py_compile research/cot/cot_atomic_ingest_v02_lab.py research/cot/test_cot_atomic_ingest_v02_lab.py
      - name: Atomicity, crash and as-of time-boundary tests only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/cot -p 'test_cot_atomic_ingest_v02_lab.py' -v 2>&1 | tee /tmp/remura-cot-atomic-v02.log
          grep -q '^Ran 16 tests' /tmp/remura-cot-atomic-v02.log
          grep -q '^OK$' /tmp/remura-cot-atomic-v02.log
          echo 'REMURA_SHARK_COT_ATOMIC_V02=16_16_PASS'
