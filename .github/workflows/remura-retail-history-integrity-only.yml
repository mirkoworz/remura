# REMURA Retail Observatory v0.1 LAB — 21/11/2026 Europe/Rome.
# Actual repo JSON read-only; no provider API, credentials, deploy or market orders.
name: REMURA Retail historical integrity REAL-FILES ONLY
on:
  push:
    branches:
      - research/retail-history-readonly-real-data-20261121
    paths:
      - research/retail/myfxbook_history_readonly_v1.py
      - research/retail/test_myfxbook_history_readonly_v1.py
      - .github/workflows/remura-retail-history-integrity-only.yml
permissions:
  contents: read
jobs:
  audit-local-history:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Ten new checks including actual repository JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/retail -p 'test_myfxbook_history_readonly_v1.py' -v 2>&1 | tee /tmp/remura-retail-history-tests.log
          grep -q '^Ran 10 tests' /tmp/remura-retail-history-tests.log
          grep -q '^OK$' /tmp/remura-retail-history-tests.log
          python3 research/retail/myfxbook_history_readonly_v1.py --repo-read-only | tee /tmp/remura-retail-aggregate.log
          grep -q '"status":"REPOSITORY_HISTORY_STRUCTURALLY_CONSISTENT_UNATTESTED"' /tmp/remura-retail-aggregate.log
          grep -q '"external_source_first_seen_verified":false' /tmp/remura-retail-aggregate.log
          echo 'REMURA_RETAIL_REAL_HISTORY_AUDIT=10_10_PASS_REPOSITORY_ONLY'
