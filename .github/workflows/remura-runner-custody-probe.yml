# REMURA runner custody preflight v0.1 LAB — 19/11/2026, sessione dopo 13:44 CET
# Diagnostic only. No checkout, secrets, external requests, artifacts, swap changes or acquisition.
name: REMURA isolated runner custody probe
on:
  push:
    branches: [research/runner-custody-probe-20261119]
    paths:
      - '.github/workflows/remura-runner-custody-probe.yml'
permissions: {}
jobs:
  probe:
    if: github.repository == 'mirkoworz/remura' && github.ref == 'refs/heads/research/runner-custody-probe-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only host observation
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os, re, resource, shutil
          from pathlib import Path
          def metric(text, name):
              vals = re.findall(r'^'+name+r':\s*(\d+)\s+kB\s*$', text, re.M)
              if len(vals) != 1:
                  raise ValueError("metric_unavailable")
              return int(vals[0])
          try:
              mem = Path('/proc/meminfo').read_text()
              rows = Path('/proc/swaps').read_text().splitlines()
              if not rows or rows[0].split() != ['Filename','Type','Size','Used','Priority']:
                  raise ValueError("swap_table_unknown")
              swap = metric(mem, 'SwapTotal')
              active = len(rows) > 1
              if (swap > 0) != active:
                  raise ValueError("swap_inconsistent")
              print('REMURA_RUNNER_PROBE=OBSERVED')
              print('MEM_AVAILABLE_KIB='+str(metric(mem,'MemAvailable')))
              print('SWAP_TOTAL_KIB='+str(swap))
              print('SWAP_ACTIVE='+('YES' if active else 'NO'))
              print('CORE_LIMIT_ZERO='+('YES' if resource.getrlimit(resource.RLIMIT_CORE)[0]==0 else 'NO'))
              print('GPG_PRESENT='+('YES' if shutil.which('gpg') else 'NO'))
              print('VISIBLE_CPUS='+str(len(os.sched_getaffinity(0))))
              print('ACQUISITION_AUTHORIZED=NO')
              print('MEMORY_NON_SWAPPABLE_ATTESTED=NO')
              print('REAL_DATA_READ=NO')
          except Exception:
              print('REMURA_RUNNER_PROBE=UNKNOWN_FAIL_CLOSED')
              raise SystemExit(2)
          PY
