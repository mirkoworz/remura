# REMURA Shark Cockpit v1.65 LAB — static product feature only.
name: REMURA Shark Cockpit v165 product-check preview
on:
  push:
    branches: [feature/shark-cockpit-v165-preview-20261122]
    paths:
      - shark-cockpit.html
      - shark-cockpit.js
      - shark-cockpit-core.js
      - shark-cockpit.css
      - nav.js
      - sw.js
      - tests/shark-cockpit.test.js
      - tests/release-consistency.test.js
      - .github/workflows/remura-shark-cockpit-v165-preview.yml
permissions:
  contents: read
jobs:
  verify-new-page:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new browser scripts and shared navigation syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check shark-cockpit-core.js
          node --check shark-cockpit.js
          node --check nav.js
          node --check sw.js
      - name: Run new Shark Cockpit product cases and changed release wiring only
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/shark-cockpit.test.js tests/release-consistency.test.js 2>&1 | tee /tmp/remura-cockpit.log
          grep -q 'fail 0' /tmp/remura-cockpit.log
          grep -q 'pass ' /tmp/remura-cockpit.log
          echo REMURA_SHARK_COCKPIT_V165=PRODUCT_SMOKE_GREEN
