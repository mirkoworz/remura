# REMURA Account Analytics Read-Only v0.1 — 13/11/2026 ore 06:55 CET
# Solo GraphQL read-only, account quota daily estimate; nessun deploy, webhook o modifica D1.
# Se manca il secret ANALYTICS, salta esplicitamente il job remoto senza fare alcuna chiamata.
name: REMURA Cloudflare Account Analytics READ-ONLY LAB

on:
  push:
    branches:
      - research/tradingview-delta-peaks-20261111
    paths:
      - ".github/workflows/remura-tv-account-analytics-readonly.yml"
      - "tradingview/delta-peaks/gateway-lab/cloudflare_account_quota_guard.py"
      - "tradingview/delta-peaks/gateway-lab/test_cloudflare_account_quota_guard.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remura-tv-account-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-safety:
    if: github.repository == 'mirkoworz/remura' && github.ref == 'refs/heads/research/tradingview-delta-peaks-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline GraphQL free quota parser guard tests
        run: python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_cloudflare_account_quota_guard.py' -v
      - name: Static Python syntax
        run: python3 -m py_compile tradingview/delta-peaks/gateway-lab/cloudflare_account_quota_guard.py

  account-analytics-readonly:
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only GraphQL account quota if a separate Analytics Read token is configured
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_ANALYTICS_READ_TOKEN: ${{ secrets.REMURA_CF_ANALYTICS_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REMURA_CF_ANALYTICS_READ_TOKEN:-}" || -z "${REMURA_CF_ACCOUNT_ID:-}" ]]; then
            echo "REMURA_CF_ACCOUNT_QUOTA=SKIPPED_MISSING_ANALYTICS_READ_TOKEN"
            echo "D1 account-wide daily metrics NOT measured; an independent Account Analytics Read token is required." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 tradingview/delta-peaks/gateway-lab/cloudflare_account_quota_guard.py
