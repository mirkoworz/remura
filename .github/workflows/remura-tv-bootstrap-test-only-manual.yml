# REMURA v0.8.27 — 13/11/2026, ore 18:41 CET
# BOOTSTRAP SOLO MANUALE: worker già esistente, codice inerte, nessun D1/Secret/ingest.
# Zero automatismi push/cron/PR; richiede conferma esatta e token Cloudflare limitato.
name: REMURA TEST Worker BOOTSTRAP (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digita DEPLOY_BOOTSTRAP_TEST_OFF_ONLY (solo Worker TEST, nessun webhook)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remura-test-worker-bootstrap-manual
  cancel-in-progress: false

jobs:
  bootstrap-existing-test-only:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mirkoworz' &&
      inputs.confirmation == 'DEPLOY_BOOTSTRAP_TEST_OFF_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
      REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
      REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
    steps:
      - name: Checkout IMMUTABLE validated bootstrap source
        uses: actions/checkout@v4
        with:
          ref: 6f7ae923261ca1bc0d1099188b1edfbe5c333d4a
          persist-credentials: false
      - name: Reject absent scoped token/account or changed bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.mjs
          test -f tradingview/delta-peaks/gateway-lab/bootstrap_settings_guard_v1.py
          test -f tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.test.mjs
          echo "REMURA_BOOTSTRAP_SOURCE=PINNED_COMMIT_6f7ae923261c"
      - name: Offline bootstrap behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.test.mjs
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_bootstrap_settings_guard_v1.py' -v
      - name: GET-only verify existing TEST Worker and zero bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/bootstrap_settings_guard_v1.py
      - name: Prepare NO-BINDINGS, safe Worker bundle (temporary)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remura-bootstrap-test"
          cp tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.mjs "$RUNNER_TEMP/remura-bootstrap-test/bootstrap_test_worker.mjs"
          cat > "$RUNNER_TEMP/remura-bootstrap-test/wrangler.json" <<'JSON'
          {
            "name": "remura-tv-webhook-test",
            "main": "bootstrap_test_worker.mjs",
            "compatibility_date": "2026-11-13",
            "workers_dev": true
          }
          JSON
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "remura-bootstrap-test/wrangler.json")
          cfg = json.load(open(p, encoding="utf-8"))
          assert set(cfg) == {"name", "main", "compatibility_date", "workers_dev"}
          assert cfg["name"] == "remura-tv-webhook-test"
          assert cfg["main"] == "bootstrap_test_worker.mjs"
          assert cfg["workers_dev"] is True
          PY
          echo "BOOTSTRAP_WORKER=remura-tv-webhook-test; NO_BINDINGS=YES; INGEST=IMPOSSIBLE"
      - name: Wrangler bootstrap dry-run, then deploy ONLY approved inert code
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 deploy --dry-run --config "$RUNNER_TEMP/remura-bootstrap-test/wrangler.json" --outdir "$RUNNER_TEMP/remura-bootstrap-dryrun"
          npx --yes wrangler@4.157.0 deploy --config "$RUNNER_TEMP/remura-bootstrap-test/wrangler.json"
          echo "REMURA_TEST_BOOTSTRAP=DEPLOY_REQUEST_COMPLETED"
          echo "NO_WEBHOOK=YES; D1_BINDINGS=NONE; DEPLOYED_WORKER=remura-tv-webhook-test"
          {
            echo "### REMURA v0.8.27 — Worker TEST inert bootstrap"
            echo "Manual dispatch only, pinned source 6f7ae923261ca1bc0d1099188b1edfbe5c333d4a, existing-worker GET preflight."
            echo "No D1, rate limiter, secrets, webhook, trade or Production Worker changes."
            echo "Confirm actual deployed Worker identity and /health separately."
          } >> "$GITHUB_STEP_SUMMARY"
