# REMURA v0.8.64 — 14/11/2026 12:59 CET
# Owner-only explicit transition of the existing isolated TEST Worker.
name: REMURA CVD TEST Transition (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Sola lettura oppure operazione esplicita sul solo Worker TEST'
        required: true
        type: choice
        default: READ_TEST_PREFLIGHT_ONLY
        options:
          - READ_TEST_PREFLIGHT_ONLY
          - DEPLOY_CVD_TEST
          - ROLLBACK_LEGACY_TEST
          - STOP_CVD_TEST
permissions:
  contents: read
concurrency:
  group: remura-test-worker-bootstrap-manual
  cancel-in-progress: false
jobs:
  transition:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mirkoworz' &&
      github.triggering_actor == 'mirkoworz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      OPERATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout immutable CI-verified candidate
        uses: actions/checkout@v4
        with:
          ref: 7ca0736ee6d933071c02b31917b94d99684bba5f
          persist-credentials: false
      - name: Offline gates without Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          node --test tradingview/delta-peaks/gateway-lab/worker_cvd_candidate.test.mjs
          python3 -m unittest discover -s tradingview/delta-peaks -p 'test_cvd*.py' -v
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_cvd_transition*.py' -v
          mkdir -p "$RUNNER_TEMP/remura-cvd-legacy-regression"
          cp tradingview/delta-peaks/gateway-lab/worker_cvd_candidate.mjs "$RUNNER_TEMP/remura-cvd-legacy-regression/worker.mjs"
          cp tradingview/delta-peaks/gateway-lab/worker.test.mjs "$RUNNER_TEMP/remura-cvd-legacy-regression/worker.test.mjs"
          node --test "$RUNNER_TEMP/remura-cvd-legacy-regression/worker.test.mjs"
      - name: Read-only preflight (default, no deployment)
        if: inputs.confirmation == 'READ_TEST_PREFLIGHT_ONLY'
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
          REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
        run: python3 tradingview/delta-peaks/gateway-lab/cvd_transition_preflight_v1.py
      - name: Prepare private bundles from verified TEST settings
        if: inputs.confirmation != 'READ_TEST_PREFLIGHT_ONLY'
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
          REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
        run: python3 tradingview/delta-peaks/gateway-lab/cvd_transition_live_bundle_v1.py "$OPERATION" prepare
      - name: Compile both candidate and rollback (dry-run only)
        if: inputs.confirmation != 'READ_TEST_PREFLIGHT_ONLY'
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_API_KEY: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        shell: bash
        run: |
          set -euo pipefail
          for bundle in "$REMURA_CVD_CANDIDATE" "$REMURA_CVD_ROLLBACK"; do
            npx --yes wrangler@4.157.0 deploy --dry-run --config "$bundle/wrangler.json" --outdir "$RUNNER_TEMP/remura-cvd-dryrun-$(basename "$bundle")"
          done
      - name: Fresh state and exact bundle check, then explicit TEST-only mutation
        id: mutation
        if: inputs.confirmation != 'READ_TEST_PREFLIGHT_ONLY'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
          REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/cvd_transition_live_bundle_v1.py "$OPERATION" precheck
          npx --yes wrangler@4.157.0 deploy --config "$REMURA_CVD_TARGET/wrangler.json"
          echo 'REMURA_CVD_MUTATION=COMMAND_SUCCEEDED_PENDING_READBACK'
      - name: Read back exact settings after attempted transition
        if: always() && steps.mutation.outcome != 'skipped' && steps.mutation.outcome != ''
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
          REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
        run: python3 tradingview/delta-peaks/gateway-lab/cvd_transition_live_bundle_v1.py "$OPERATION" postcheck
      - name: Always remove private bundles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for dir in "${REMURA_CVD_CANDIDATE:-}" "${REMURA_CVD_ROLLBACK:-}"; do
            if [[ "$dir" == "$RUNNER_TEMP"/remura-test-off-* && -d "$dir" && ! -L "$dir" ]]; then
              rm -rf -- "$dir"
            fi
          done
          echo 'No automatic rollback; no SQL changes; no production deployment.'
