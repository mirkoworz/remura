# REMURA TradingView Telemetry LAB v0.8.3 — aggiornamento 11/11/2026 18:00 CET.
# SOLO CI OFFLINE. Nessun deploy, webhook, credenziale o trade automatico.
name: REMURA TradingView Telemetry LAB
on:
  pull_request:
    paths:
      - "tradingview/delta-peaks/**"
      - ".github/workflows/remura-tv-telemetry-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remura-tv-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-validator:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 102
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sola lettura
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Esegui regressioni prospettiche e validazione (no rete)
        run: python3 -m unittest discover -s tradingview/delta-peaks -p "test_*.py" -v
      - name: Python syntax preflight Pine-independent
        run: python3 -m py_compile tradingview/delta-peaks/validate_telemetry_v1.py tradingview/delta-peaks/test_telemetry_v1.py tradingview/delta-peaks/outcome_audit_v1.py tradingview/delta-peaks/test_outcome_audit_v1.py
      - name: Node v22 test gateway Cloudflare D1 simulato (offline, senza pacchetti)
        run: node --test tradingview/delta-peaks/gateway-lab/worker.test.mjs
      - name: JavaScript syntax check del gateway (non deploy)
        run: node --check tradingview/delta-peaks/gateway-lab/worker.mjs
