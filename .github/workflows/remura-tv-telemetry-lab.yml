# REMURA TradingView Telemetry LAB v0.8.35 — aggiornamento 13/11/2026 CET.
# SOLO CI OFFLINE. Nessun deploy, webhook, credenziale o trade automatico.
name: REMURA TradingView Telemetry LAB
on:
  pull_request:
    paths:
      - "tradingview/delta-peaks/**"
      - ".github/workflows/remura-tv-telemetry-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remura-tv-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-validator:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 102
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sola lettura
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Esegui regressioni prospettiche e validazione (no rete)
        run: python3 -m unittest discover -s tradingview/delta-peaks -p "test_*.py" -v
      - name: D1 read-only connector mocked regressions (no API)
        run: python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p "test_d1_preview_reader_v1.py" -v
      - name: TEST-only Worker manifest guard (offline, blocks unresolved deployment)
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_manifest_guard_v1.py' -v
          python3 tradingview/delta-peaks/gateway-lab/predeploy_test_manifest_guard_v1.py
      - name: Python syntax preflight Pine-independent
        run: python3 -m py_compile tradingview/delta-peaks/validate_telemetry_v1.py tradingview/delta-peaks/test_telemetry_v1.py tradingview/delta-peaks/outcome_audit_v1.py tradingview/delta-peaks/test_outcome_audit_v1.py tradingview/delta-peaks/quota_budget_v1.py tradingview/delta-peaks/test_quota_budget_v1.py tradingview/delta-peaks/remura_tv_bridge_preview_v1.py tradingview/delta-peaks/test_remura_tv_bridge_preview_v1.py tradingview/delta-peaks/test_offline_webhook_roundtrip_v1.py tradingview/delta-peaks/gateway-lab/d1_preview_reader_v1.py tradingview/delta-peaks/gateway-lab/test_d1_preview_reader_v1.py tradingview/delta-peaks/gateway-lab/predeploy_test_manifest_guard_v1.py tradingview/delta-peaks/gateway-lab/test_manifest_guard_v1.py
      - name: Node v22 test gateway Cloudflare D1 simulato (offline, senza pacchetti)
        run: node --test tradingview/delta-peaks/gateway-lab/worker.test.mjs
      - name: Offline authenticated rollback preflight regression (no API)
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_worker_rollback_preflight_v1.py' -v
          python3 -m py_compile tradingview/delta-peaks/gateway-lab/worker_rollback_preflight_v1.py
      - name: Ephemeral isolated gateway TEST OFF package (offline only)
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_prepare_test_off_bundle_v1.py' -v
          python3 -m py_compile tradingview/delta-peaks/gateway-lab/prepare_test_off_bundle_v1.py
      - name: Emergency STOP for TEST gateway ON or OFF with separate hash Secret (offline only)
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_emergency_stop_test_guard_v1.py' -v
          python3 -m py_compile tradingview/delta-peaks/gateway-lab/emergency_stop_test_guard_v1.py
      - name: Offline rollback strict OFF-only gate (no Cloudflare)
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_off_gateway_rollback_guard_v1.py' -v
          python3 -m py_compile tradingview/delta-peaks/gateway-lab/off_gateway_rollback_guard_v1.py
      - name: Offline per-Worker bootstrap GET metadata preflight test
        run: |
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_bootstrap_settings_guard_v1.py' -v
          python3 -m py_compile tradingview/delta-peaks/gateway-lab/bootstrap_settings_guard_v1.py
      - name: Offline bootstrap safe Worker tests (does not deploy)
        run: node --test tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.test.mjs
      - name: JavaScript syntax check bootstrap safe Worker
        run: node --check tradingview/delta-peaks/gateway-lab/bootstrap_test_worker.mjs
      - name: JavaScript syntax check synthetic webhook fixture
        run: node --check tradingview/delta-peaks/gateway-lab/offline_webhook_roundtrip.mjs
      - name: JavaScript syntax check del gateway (non deploy)
        run: node --check tradingview/delta-peaks/gateway-lab/worker.mjs
