# REMURA LAB v0.8.38 — 14/11/2026
# READ ONLY. No deploy, writes or TradingView webhook. Run once after alert fires.
name: REMURA TEST First Webhook Receipt (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remura-tv-test-receipt-audit
  cancel-in-progress: false
jobs:
  verify-test-receipts:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mirkoworz'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab5505390af7511b636fcf065ace05a6cae97164
          persist-credentials: false
      - name: Run offline safety regressions first
        run: python3 tradingview/delta-peaks/gateway-lab/test_pilot_receipt_audit_v1.py --self-test
      - name: Verify first matching TEST receipts after real activation
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/test_pilot_receipt_audit_v1.py --live-read | tee "$RUNNER_TEMP/remura-receipt-summary.txt"
          {
            echo '### REMURA — pilot receipt TEST metadata (read-only)'
            echo 'No secrets, raw JSON, price data, deploy or SQL writes.'
            echo 'First 100 matching records since 14/11/2026 06:03:11 UTC; not a total when MORE_AVAILABLE=True.'
            echo 'No matching records does not distinguish no alerts from delivery errors.'
            echo ''
            echo '~~~'
            cat "$RUNNER_TEMP/remura-receipt-summary.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
