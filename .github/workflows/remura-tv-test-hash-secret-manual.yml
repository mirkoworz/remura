# REMURA TradingView LAB v0.8.36 — 13/11/2026 CET.
# Owner-only; install ONLY SHA-256 HASH as Cloudflare secret on TEST gateway OFF.
# Never raw token. No webhook alert, no ingest ON, no automatic scheduling.
name: REMURA TEST Webhook HASH SECRET (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Solo hash TEST nel Worker TEST; INGEST resta DISATTIVATO'
        required: true
        type: choice
        options:
          - INSTALL_ONLY_TEST_HASH_KEEP_INGEST_OFF

permissions:
  contents: read

concurrency:
  group: remura-test-worker-bootstrap-manual
  cancel-in-progress: false

jobs:
  install-hash-secret-test-only:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mirkoworz' &&
      inputs.confirmation == 'INSTALL_ONLY_TEST_HASH_KEEP_INGEST_OFF'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
      REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
      REMURA_CF_D1_READ_TOKEN: ${{ secrets.REMURA_CF_D1_READ_TOKEN }}
      REMURA_CF_TEST_WORKER_EDITOR_TOKEN: ${{ secrets.REMURA_CF_TEST_WORKER_EDITOR_TOKEN }}
      REMURA_CF_TV_TEST_WEBHOOK_SHA256: ${{ secrets.REMURA_CF_TV_TEST_WEBHOOK_SHA256 }}
    steps:
      - name: Checkout immutable tested TEST-only source
        uses: actions/checkout@v4
        with:
          ref: af67fda26aae215da0a6157e79f73ef9b76a9a3b
          persist-credentials: false
      - name: Safe tests and fail-closed hash format (no values in logs)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REMURA_CF_ACCOUNT_ID"
          test -n "$REMURA_CF_D1_READ_TOKEN"
          test -n "$REMURA_CF_TEST_WORKER_EDITOR_TOKEN"
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_prepare_test_hash_secret_v1.py' -v
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_emergency_stop_test_guard_v1.py' -v
          python3 -m unittest discover -s tradingview/delta-peaks/gateway-lab -p 'test_prepare_test_off_bundle_v1.py' -v
          python3 - <<'PY'
          import os, re, sys
          digest = os.environ.get("REMURA_CF_TV_TEST_WEBHOOK_SHA256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              print("REMURA_TEST_HASH_FORMAT=INVALID_OR_MISSING")
              sys.exit(2)
          print("REMURA_TEST_HASH_FORMAT=VALID_64_HEX_NOT_ECHOED")
          PY
      - name: Fresh authenticated TEST OFF without hash + temporary private manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/prepare_test_hash_secret_v1.py
          echo 'REMURA_HASH_TARGET=TEST_ONLY; D1=EU_TEST_ONLY; INGEST=OFF'
      - name: Dry-run TEST bundle with exact D1 TEST and OFF
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REMURA_TEST_SECRET_BUNDLE/wrangler.json"
          npx --yes wrangler@4.157.0 deploy --dry-run \
            --config "$REMURA_TEST_SECRET_BUNDLE/wrangler.json" \
            --outdir "$RUNNER_TEMP/remura-hash-test-dryrun"
          echo 'REMURA_TEST_HASH_DRY_RUN=PASS'
      - name: Recheck actual Worker OFF immediately before adding hash secret
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/emergency_stop_test_guard_v1.py \
            | grep -Fx 'REMURA_TEST_EMERGENCY_PREFLIGHT=TEST_GATEWAY_OFF_NO_SECRET'
      - name: Owner-authorized TEST Worker secret put ONLY, never raw token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REMURA_CF_TV_TEST_WEBHOOK_SHA256" \
            | npx --yes wrangler@4.157.0 secret put WEBHOOK_TOKEN_SHA256 \
                --name remura-tv-webhook-test \
                --config "$REMURA_TEST_SECRET_BUNDLE/wrangler.json"
          echo 'REMURA_TEST_HASH_SECRET_PUT=COMMAND_SUCCEEDED_PENDING_POSTCHECK'
      - name: Read back TEST D1 limiter OFF and secret name ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 tradingview/delta-peaks/gateway-lab/emergency_stop_test_guard_v1.py \
            | grep -Fx 'REMURA_TEST_EMERGENCY_PREFLIGHT=TEST_GATEWAY_OFF_WITH_HASH_SECRET'
          {
            echo '### REMURA TEST SHA-256-only Cloudflare secret — owner dispatched'
            echo 'Worker: remura-tv-webhook-test (not production).'
            echo 'Only hashed TEST URL token sent to Cloudflare as encrypted Secret.'
            echo 'Actual raw URL token never entered GitHub or Cloudflare configs.'
            echo 'D1 TEST binding and rate limiter verified; INGEST remains OFF.'
            echo 'Webhook not configured; external health and billing are separate gates.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary manifest and source from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REMURA_TEST_SECRET_BUNDLE:-}" &&
                "$REMURA_TEST_SECRET_BUNDLE" == "$RUNNER_TEMP"/remura-test-off-* ]]; then
            rm -rf -- "$REMURA_TEST_SECRET_BUNDLE"
          fi
          rm -rf -- "$RUNNER_TEMP/remura-hash-test-dryrun"
          echo 'REMURA_TEST_HASH_TEMP_CLEANUP=ATTEMPTED'
