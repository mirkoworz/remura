# REMURA TradingView v0.8.186 LAB — 21/11/2026 Europe/Rome
# New detached-signature primitive ONLY; no cloud, secrets, deploy, or legacy suites.
name: REMURA TV v0186 detached witness ONE-SHOT
on:
  push:
    branches:
      - research/tv-detached-anchor-verifier-v0186-20261121
    paths:
      - tradingview/delta-peaks/detached_witness_v0186_lab.mjs
      - tradingview/delta-peaks/test_detached_witness_v0186_lab.mjs
      - .github/workflows/remura-tv-v0186-detached-witness-only.yml
permissions:
  contents: read
jobs:
  detached-witness-only:
    if: github.repository == 'mirkoworz/remura'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run only 14 new detached signature tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tradingview/delta-peaks/test_detached_witness_v0186_lab.mjs 2>&1 | tee /tmp/remura-v0186-detached.log
          grep -q '^1..14$' /tmp/remura-v0186-detached.log
          grep -q '^# pass 14$' /tmp/remura-v0186-detached.log
          grep -q '^# fail 0$' /tmp/remura-v0186-detached.log
          echo 'REMURA_TV_V0186_DETACHED_SIGNATURE=14_14_PASS'
