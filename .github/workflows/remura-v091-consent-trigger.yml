# REMURA Contributors v0.91 LAB — 21/11/2026 Europe/Rome
# Authorized diagnostic: one new owner-consent commit ONLY. Zero scheduler/dispatch.
# Fix: validate Git diff inside runner; GitHub push head_commit.added was not
# reliable for the first authorized push (SKIPPED, zero provider requests).
name: REMURA v0.91 D1 second-consent safe trigger
on:
  push:
    branches: [research/contributors-d1-diagnostic-v091-20261121]
    paths:
      - research/contributors/V091-ONE-TIME-OWNER-CONSENT-V2.txt
permissions:
  contents: read
concurrency:
  group: remura-v091-authorized-d1-once
  cancel-in-progress: false
jobs:
  verify-consent-before-secrets:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/research/contributors-d1-diagnostic-v091-20261121' &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only checkout with parent for exact single-file delta
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify owner consent and immutable read-only scripts (NO secrets)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git log -1 --format=%s)" = "chore(remura): OWNER_APPROVES_D1_ONE_TIME_V091_SECOND_TRIGGER"
          only_file="$(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD)"
          expected="$(printf 'A\t%s' 'research/contributors/V091-ONE-TIME-OWNER-CONSENT-V2.txt')"
          test "$only_file" = "$expected"
          test "$(git hash-object research/contributors/cloudflare_d1_diagnostic_v091_lab.py)" = "f5568f365232a943d6b53b6c8581cd158f21188e"
          test "$(git hash-object research/contributors/readonly_probe_plan_v086_lab.py)" = "bfc0315067c2adb5436e6166a6af88761adfd615"
          test "$(git hash-object research/contributors/monitor_query_reference_v086_lab.graphql)" = "cf804bf39721fcd2f791722d07bcb1e07a1391ae"
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          name="research/contributors/V091-ONE-TIME-OWNER-CONSENT-V2.txt"
          expected=("REMURA_V091_OWNER_CONSENT_FOR_D1_ONLY:"
                    +datetime.now(timezone.utc).date().isoformat()+"\n").encode("ascii")
          if Path(name).read_bytes()!=expected:
              raise SystemExit("REMURA_V091_CONSENT_STALE_OR_INVALID")
          print("REMURA_V091_OWNER_CONSENT=VERIFIED")
          PY
      - name: Bounded single authorized Cloudflare GraphQL diagnosis
        env:
          REMURA_CF_ACCOUNT_ID: ${{ secrets.REMURA_CF_ACCOUNT_ID }}
          REMURA_CF_ANALYTICS_READ_TOKEN: ${{ secrets.REMURA_CF_ANALYTICS_READ_TOKEN }}
          REMURA_CF_PROBE_ACK: AUTORIZZO_DIAGNOSI_D1_MAX_2_POST_SOLO_LETTURA
          REMURA_V091_ACTIVATE: USER_APPROVED_READ_ONLY_ONCE
        shell: bash
        run: |
          set -euo pipefail
          python3 research/contributors/cloudflare_d1_diagnostic_v091_lab.py --execute-one-time
