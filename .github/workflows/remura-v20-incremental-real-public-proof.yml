# REMURA V20.1 — 23/11/2026. Evidence from pinned real PUBLIC JSON, offline.
# One branch-only proof run; no Secrets, broker, external provider, Cloudflare, D1, Firestore or deploy.
name: REMURA V20.1 Pinned Real Public Data Proof
on:
  push:
    branches:
      - research/remura-v20-incremental-observations-20261123
    paths:
      - .github/workflows/remura-v20-incremental-real-public-proof.yml
permissions:
  contents: read
jobs:
  real-public-file-audit:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/research/remura-v20-incremental-observations-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout non-production audit code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact public data main SHA after checkpoint
        uses: actions/checkout@v4
        with:
          ref: a1188f8af77951b9c59b7bb1facbfa6fe2f820e7
          path: public-pinned-data
          persist-credentials: false
      - name: Audit 34 REAL public Myfxbook JSON files, no provider call
        shell: bash
        run: |
          set -euo pipefail
          python3 research/v20_incremental_observation_audit.py \
            --myfxbook-dir public-pinned-data/data/myfxbook/history \
            --since 2026-11-22T22:25:00Z \
            --as-of 2026-11-23T05:35:00Z \
            > "$RUNNER_TEMP/remura-real-public.json"
          python3 - "$RUNNER_TEMP/remura-real-public.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          s=r['myfxbook_retail_public']
          expected={'series_total':34, 'observations_retained':3924,
                    'series_updated_after_checkpoint':30,
                    'new_records_retained_after_checkpoint':30,
                    'changed_long_pct_since_checkpoint':18,
                    'unchanged_long_pct_since_checkpoint':12,
                    'changed_payload_since_checkpoint':30,
                    'stale_over_24h':4,
                    'no_new_checkpoint_records':4}
          for k,v in expected.items():
              assert s[k]==v,(k,s[k],v)
          assert s['stale_public_series']==['NAS100','US2000','US30','US500']
          assert r['performance_or_alpha_measured'] is False
          print('REMURA_V20_REAL_PUBLIC_PINNED=34_SERIES_30_NEW_18_PCT_CHANGED_4_STALE_PASS')
          print(json.dumps(s,sort_keys=True,ensure_ascii=False))
          PY
          {
            echo '### REMURA V20.1 — pinned real PUBLIC observation audit'
            echo 'Source main commit: a1188f8af77951b9c59b7bb1facbfa6fe2f820e7'
            echo 'Checkpoint: 2026-11-22 22:25Z; audit cutoff: 2026-11-23 05:35Z'
            echo '34 historic series, 30 new snapshots, 18 long% changes, 4 stale indices — validated from real files.'
            echo 'No provider API, private data, first-seen proof, CVD, price outcome or alpha claim.'
          } >> "$GITHUB_STEP_SUMMARY"
