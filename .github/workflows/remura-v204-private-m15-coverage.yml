# REMURA V20.4 — 23 Nov 2026 Europe/Rome — OFFLINE private-price coverage
# This tests only a NEW read-only module, never opens personal DB on CI.
name: REMURA V20.4 Real CVD to Local M15 Coverage NEW Tests
on:
  push:
    branches:
      - research/remura-v204-private-price-coverage-20261123
    paths:
      - .github/workflows/remura-v204-private-m15-coverage.yml
permissions:
  contents: read
jobs:
  new-read-only-m15-checks:
    if: >-
      github.repository == 'mirkoworz/remura' &&
      github.ref == 'refs/heads/research/remura-v204-private-price-coverage-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run 9 NEW tests only
        shell: bash
        run: |
          set -euo pipefail
          cd research
          python3 -m unittest -v test_v204_private_cvd_price_coverage.py
          python3 -m py_compile v204_private_cvd_price_coverage.py
          echo REMURA_V204_NEW_TESTS=9_PASS
      - name: Evaluate exact REAL saved CVD proof with NO PRIVATE PRICES
        shell: bash
        run: |
          set -euo pipefail
          python3 research/v204_private_cvd_price_coverage.py \
            --receipt-proof research/real-proofs/REMURA-V203-CVD-TEST-RECEIPTS-20261123.json \
            > "$RUNNER_TEMP/cvd-price-coverage.json"
          python3 - "$RUNNER_TEMP/cvd-price-coverage.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding="utf-8"))
          assert a["status"] == "PRICE_NOT_PROVIDED"
          assert a["cvd_receipts_verified_requested_window"] == 12
          assert a["m15_cohorts_unique_not_12_independent_trades"] == 4
          assert a["statistical_alpha_established"] is False
          assert a["directional_outcomes_computed"] is False
          assert all(v["complete_unique_m15_price_cohorts"]==0 for v in a["horizons"].values())
          print("REMURA_V204_REAL_CVD_INPUT_AND_PRIVATE_M15_ABSENCE=12_TO_4_COHORTS_NO_ALPHA_PASS")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### REMURA V20.4 — real CVD 12/12 and future-price readiness\n\n")
              f.write("- Real owner-authorized CVD M5 receipts: **12/12**.\n")
              f.write("- Unique conservative future M15 entry cohorts: **4**, NOT 12 trades.\n")
              f.write("- Private cTrader price snapshot: **NOT PRESENT IN PUBLIC GITHUB**.\n")
              f.write("- Prices/returns/PnL/alpha: **NOT COMPUTED**, no Secrets, no D1, no broker calls.\n")
          PY
