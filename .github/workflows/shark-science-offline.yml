      - 'tests/test_shark_science_gate.py'
      - 'tests/test_shark_cvd_incremental_protocol.py'
      - 'tests/test_shark_cvd_full_denominator_audit.py'
      - 'tests/test_shark_cvd_same_source_preflight.py'
      - 'tests/test_shark_cvd_same_source_adapter.py'
      - 'tests/test_shark_walkforward.py'
      - 'tests/test_shark_data_readiness.py'
      - 'tests/test_shark_research_census.py'
      - 'tests/test_shark_universe_lineage.py'
      - 'tests/test_shark_universe_probe.py'
      - 'tests/test_shark_research_probe.py'
      - 'tests/test_shark_cot_paired_baseline.py'
      - 'tests/test_shark_cot_robustness.py'
      - 'tests/test_shark_cot_asof_witness.py'
      - 'tests/test_shark_signal_evidence.py'
      - 'tests/test_shark_price_asof_evidence.py'
      - 'tests/test_shark_observation_bundle.py'
      - 'tests/test_shark_price_only_universe.py'
      - 'tests/test_shark_price_only_compact.py'
      - 'tests/test_shark_prospective_coverage.py'
      - 'tests/test_shark_first_invocation.py'
      - 'tests/test_shark_scan_failures.py'
      - 'tests/test_shark_sample_admission.py'
      - 'tests/test_shark_causal_pair_audit.py'
      - 'tests/test_shark_compact_adapter.py'
      - 'tests/test_shark_single_pass_gate.py'
      - 'scripts/private_server.py'
      - 'tests/test_shark_real_ingest_race.py'
      - 'tests/test_shark_staging_scan.py'
      - 'tests/test_shark_oracle_staging_gate.py'
      - 'tests/test_shark_optin_adapter.py'
      - 'tests/test_shark_cvd_ledger.py'
      - 'tests/test_shark_cvd_source_lineage.py'
      - 'tests/test_shark_cvd_cot_price_triage.py'
      - 'tests/test_shark_cvd_scan_coverage.py'
      - 'tests/test_shark_cot_cvd_scan_reconciliation.py'
      - 'tests/test_shark_prefix_cost_probe.py'
      - 'tests/test_shark_research_local_archive.py'
      - 'tests/test_shark_cvd_sharded_ledger.py'
      - 'tests/test_shark_cvd_storage_gate.py'
      - 'tests/test_shark_oracle_capacity_readonly.py'
      - 'tests/test_shark_p0b_passive_observer.py'
      - 'tests/test_shark_p0b_window_census.py'
      - 'tests/test_shark_cvd_shard_backup.py'
      - 'tests/test_shark_p0_go_no_go.py'
      - 'ROADMAP-B-SHARK-SCIENCE.md'
      - '.github/workflows/shark-science-offline.yml'
  workflow_dispatch:

# Only the newest revision of this large offline research suite should run.
# Prevent branch-only CI updates from consuming extra hosted runner minutes.
concurrency:
  group: remura-shark-offline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline script syntax
        run: |
          node --check cvd-divergence-core.js
          python -m py_compile scripts/cvd_divergence.py scripts/cvd_benchmark.py scripts/cvd_session_replay.py scripts/shark_science_gate.py scripts/shark_cvd_incremental_protocol.py scripts/shark_cvd_full_denominator_audit.py scripts/shark_cvd_same_source_preflight.py scripts/shark_cvd_same_source_adapter.py scripts/shark_walkforward.py scripts/shark_data_readiness.py scripts/shark_research_census.py scripts/shark_universe_lineage.py scripts/shark_universe_probe.py scripts/shark_research_probe.py scripts/shark_cot_paired_baseline.py scripts/shark_cot_robustness.py scripts/shark_cot_asof_witness.py scripts/shark_signal_evidence.py scripts/shark_price_asof_evidence.py scripts/shark_observation_bundle.py scripts/shark_price_only_universe.py scripts/shark_price_only_compact.py scripts/shark_prospective_coverage.py scripts/shark_first_invocation.py scripts/shark_scan_failures.py scripts/shark_sample_admission.py scripts/shark_causal_pair_audit.py scripts/shark_resource_probe.py scripts/shark_digest_ab_benchmark.py scripts/shark_oracle_staging_gate.py scripts/shark_cvd_ledger.py scripts/shark_cvd_source_lineage.py scripts/shark_cvd_cot_price_triage.py scripts/shark_cvd_scan_coverage.py scripts/shark_cot_cvd_scan_reconciliation.py scripts/shark_cvd_prefix_lineage.py scripts/shark_prefix_cost_probe.py scripts/shark_research_local_archive.py scripts/shark_cvd_sharded_ledger.py scripts/shark_cvd_shard_backup.py scripts/shark_cvd_storage_gate.py scripts/shark_cvd_shard_resource_probe.py scripts/shark_oracle_capacity_readonly.py scripts/shark_p0b_passive_observer.py scripts/shark_p0b_window_census.py scripts/shark_p0_go_no_go.py
      - name: Test CVD JS detector
        run: node --test tests/cvd-divergence.test.js
      - name: Test CVD parity, benchmark and archive replay
        run: python -m unittest discover -s tests -p 'test_cvd_*.py' -v
      - name: Audit prospective CVD incremental study and prevent missing coverage from becoming false negatives
        run: |
          python -B scripts/shark_cvd_incremental_protocol.py --self-check
          python -m unittest discover -s tests -p 'test_shark_cvd_incremental_protocol.py' -v
      - name: Test original in-memory OHLC source reuse without broker GET, DB, disk writes or CVD production activation
        run: python -m unittest discover -s tests -p 'test_shark_cvd_same_source_preflight.py' -v
      - name: Test original-source opt-in CVD adapter, atomic private batch, UNKNOWN and SQLite lock
        run: python -m unittest discover -s tests -p 'test_shark_cvd_same_source_adapter.py' -v
      - name: Verify read-only exact source HMAC overlap for FULL_34 price denominator vs 2-market CVD pilot
        run: python -m unittest discover -s tests -p 'test_shark_cvd_full_denominator_audit.py' -v
      - name: Test causal evidence provenance
        run: python -m unittest discover -s tests -p 'test_shark_science_gate.py' -v
      - name: Test chronological cost-aware simulation and embargo
        run: python -m unittest discover -s tests -p 'test_shark_walkforward.py' -v
      - name: Test read-only live-archive research readiness and COT first-seen
        run: python -m unittest discover -s tests -p 'test_shark_data_readiness.py' -v
      - name: Test real-sample census and privacy on read-only SQLite snapshots
        run: python -m unittest discover -s tests -p 'test_shark_research_census.py' -v
      - name: Test point-in-time COT provenance across complete monitored FX and futures universe
        run: python -m unittest discover -s tests -p 'test_shark_universe_lineage.py' -v
      - name: Test pinned no-deploy whole-universe COT runner with offline SQLite
        run: python -m unittest discover -s tests -p 'test_shark_universe_probe.py' -v
      - name: Test one-shot research probe with pinned Git blobs and no network
        run: python -m unittest discover -s tests -p 'test_shark_research_probe.py' -v
      - name: Test real-cohort paired COT baseline with explicit costs
        run: python -m unittest discover -s tests -p 'test_shark_cot_paired_baseline.py' -v
      - name: Test chronological COT weeks, inverted control and cost stress
        run: python -m unittest discover -s tests -p 'test_shark_cot_robustness.py' -v
      - name: Test future-only immutable COT evidence without fictitious original first-seen
        run: python -m unittest discover -s tests -p 'test_shark_cot_asof_witness.py' -v
      - name: Test prospective Squalincome event-to-COT evidence consistency and rollback
        run: python -m unittest discover -s tests -p 'test_shark_signal_evidence.py' -v
      - name: Test prospective closed M15 H1 H4 price-source timestamps and rollup evidence
        run: python -m unittest discover -s tests -p 'test_shark_price_asof_evidence.py' -v
      - name: Test two-source COT and OHLC bundle with partial proof and SQLite atomic rollback
        run: python -m unittest discover -s tests -p 'test_shark_observation_bundle.py' -v
      - name: Test prospective COT-independent price-only scan universe using live price_view
        run: python -m unittest discover -s tests -p 'test_shark_price_only_universe.py' -v
      - name: Test immutable lossless compact 34-market scan batches, targeted scope and SHA integrity
        run: python -m unittest discover -s tests -p 'test_shark_price_only_compact.py' -v
      - name: Test immutable first enabled scanner invocation and no backdated research start
        run: python -m unittest discover -s tests -p 'test_shark_first_invocation.py' -v
      - name: Verify exact same-observation COT and price proof pairing against future-data leakage
        run: python -m unittest discover -s tests -p 'test_shark_causal_pair_audit.py' -v
      - name: Test prospective sample admissibility without COT/CVD/OOS lookahead or fabricated profits
        run: python -m unittest discover -s tests -p 'test_shark_sample_admission.py' -v
      - name: Test allowlisted observed-only failure ledger and original exception preservation
        run: python -m unittest discover -s tests -p 'test_shark_scan_failures.py' -v
      - name: Test read-only first-recorded FULL-scan coverage, missing slots and unknown market cells
        run: python -m unittest discover -s tests -p 'test_shark_prospective_coverage.py' -v
      - name: Test explicit compact scanner opt-in against original Squalincome, price failures and COT gaps
        run: python -m unittest discover -s tests -p 'test_shark_compact_adapter.py' -v
      - name: Prove one-pass future periodic research gate OFF by default and post-ingest unchanged
        run: python -m unittest discover -s tests -p 'test_shark_single_pass_gate.py' -v
      - name: Reproduce real local cTrader price-store ingest race and fresh retry on synthetic SQLite
        run: python -m unittest discover -s tests -p 'test_shark_real_ingest_race.py' -v
      - name: Stage full original 34-market Squalincome against independent price-only record in disposable SQLite
        run: python -m unittest discover -s tests -p 'test_shark_staging_scan.py' -v
      - name: Test Oracle staging script safety and isolated synthetic restore
        run: |
          python scripts/shark_oracle_staging_gate.py --self-check
          python -m unittest discover -s tests -p 'test_shark_oracle_staging_gate.py' -v
      - name: Verify off-by-default real Squalincome opt-in against COT failures and all 34 markets
        run: python -m unittest discover -s tests -p 'test_shark_optin_adapter.py' -v
      - name: Test append-only M15 CVD evaluation coverage without manufactured negatives
        run: python -m unittest discover -s tests -p 'test_shark_cvd_scan_coverage.py' -v
      - name: Audit original COT-price signal versus private CVD M15 scan as-of and same source
        run: python -m unittest discover -s tests -p 'test_shark_cot_cvd_scan_reconciliation.py' -v
      - name: 'Test strict same-snapshot COT-price-CVD triage across two synthetic private databases'
        run: python -m unittest discover -s tests -p 'test_shark_cvd_cot_price_triage.py' -v
      - name: 'Test private CVD source lineage - original detector replay, exact OHLC HMAC, no retrospective binding'
        run: python -m unittest discover -s tests -p 'test_shark_cvd_source_lineage.py' -v
      - name: Test append-only future CVD evidence ledger and privacy
        run: python -m unittest discover -s tests -p 'test_shark_cvd_ledger.py' -v
      - name: Gate research pilot against real ingest overlap and verified account billing - NO-GO by default
        run: python -m unittest discover -s tests -p 'test_shark_p0_go_no_go.py' -v
      - name: Verify non-destructive local causal evidence archive SHA and in-memory replay without LIVE files
        run: python -m unittest discover -s tests -p 'test_shark_research_local_archive.py' -v
      - name: Test private CVD scan shards fail-closed rollover, hash chain and crash replay
        run: python -m unittest discover -s tests -p 'test_shark_cvd_sharded_ledger.py' -v
      - name: Test two-copy free-space capacity envelope and simulated disk-full before CVD writes
        run: python -m unittest discover -s tests -p 'test_shark_cvd_storage_gate.py' -v
      - name: Test interrupted CVD shard rollover and complete private SQLite snapshot and restore
        run: python -m unittest discover -s tests -p 'test_shark_cvd_shard_backup.py' -v
      - name: Verify Oracle host read-only capacity model on synthetic fixtures without LIVE access
        run: |
          python -B scripts/shark_oracle_capacity_readonly.py --self-check
          python -m unittest discover -s tests -p 'test_shark_oracle_capacity_readonly.py' -v
      - name: Verify one-batch passive cgroup and PSI sampler OFFLINE, no Oracle or broker calls
        run: |
          python -B scripts/shark_p0b_passive_observer.py --self-check
          python -m unittest discover -s tests -p 'test_shark_p0b_passive_observer.py' -v
      - name: Test fail-closed offline census of independent passive natural batches (no broker VPS writes)
        run: |
          python -B scripts/shark_p0b_window_census.py --self-check
          python -m unittest discover -s tests -p 'test_shark_p0b_window_census.py' -v
      - name: Measure private CVD shard synthetic CPU RSS WAL journal locks snapshot restore and disk-full
        run: python scripts/shark_cvd_shard_resource_probe.py
      - name: Probe isolated optional CVD prefix CPU and SQLite page bytes with balanced synthetic pairs
        run: |
          python -m unittest discover -s tests -p 'test_shark_prefix_cost_probe.py' -v
          python scripts/shark_prefix_cost_probe.py
      - name: Measure synthetic RSS, CPU, WAL and writer lock with two clean 34x4000 scan processes
        run: python scripts/shark_resource_probe.py
      - name: Pair exact same-runner old redundant SHA vs reused attestation (ABBA 34x4000)
        run: python scripts/shark_digest_ab_benchmark.py
