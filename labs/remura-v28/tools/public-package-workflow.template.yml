# TEMPLATE ONLY. Do not register or dispatch without separate approval.
name: REMURA public LAB package (manual only)
on:
  workflow_dispatch:
    inputs:
      consent:
        required: true
        type: choice
        options: [PACKAGE_PUBLIC_LAB_ONLY_NO_DEPLOY]
permissions:
  contents: read
jobs:
  package:
    if: inputs.consent == 'PACKAGE_PUBLIC_LAB_ONLY_NO_DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: REPLACE_WITH_REVIEWED_PACKAGER_COMMIT
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing candidate and build public-only artifact
        run: |
          node --test labs/remura-v28/tests/myfxbook-history-merge.test.mjs labs/remura-v28/tests/retail-release-coherence.test.mjs labs/remura-v28/tests/pages-offline.test.mjs
          node labs/remura-v28/tools/pack-public-release.mjs labs/remura-v28/tools/public-release-v181.json public-remura > SHA256SUMS
          (cd public-remura && sha256sum -c ../SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: REMURA-v1.81-public-only
          path: public-remura/
          retention-days: 3
          if-no-files-found: error
